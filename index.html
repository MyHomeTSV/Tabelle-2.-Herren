<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>TSV Großenkneten - Vereinsspiele</title>
  <script
    type="text/javascript"
    src="https://www.fussball.de/widgets.js">
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      width: 100%;
      height: 100%;
    }

    /*
      ANPASSUNGSWERTE:
      --crop-top    = Pixel, die oben abgeschnitten werden
      --crop-height = Pixel, die danach noch sichtbar bleiben (Höhe)
      --crop-left   = Pixel, die links abgeschnitten werden
      --crop-right  = Pixel, die rechts abgeschnitten werden
    */
    :root {
      --crop-top: 260px;
      --crop-height: 1700px;
      --crop-left: 0px;
      --crop-right: 0px;
      --zoom: 1.3; /* 1.0 = normale Größe, 1.3 = 30% größer, 1.5 = 50% größer usw. */

    #viewport {
      width: 100vw;
      height: var(--crop-height);
      overflow: hidden;
      position: relative;
    }

    #shifter {
      position: absolute;
      top: calc(-1 * var(--crop-top));
      left: calc(-1 * var(--crop-left));
      width: calc(100% + var(--crop-left) + var(--crop-right));
    }

    .fussballde_widget {
      width: 100% !important;
      zoom: var(--zoom);
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="shifter">
      <div
      class="fussballde_widget"
      data-id="35cadcca-1b8a-420c-ab73-1cd44c8b7cc6"
      data-type="table"
        style="width: 100%"
      ></div>
    </div>
  </div>
</body>
</html>
