<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>TSV Großenkneten - 2.Herren</title>
  <script type="text/javascript" src="https://www.fussball.de/widgets.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    html, body, #viewport, #shifter {
      overflow-anchor: none;
    }
    :root {
      --crop-top: 0px;
      --static-crop-top: 100px;  /* EINSTELLBAR: fester Bereich (px) oben, der IMMER abgeschnitten bleibt, z. B. 100px */
      --zoom: 1.6;              /* EINSTELLBAR: Größe der Tabelle. 1.0 = normal, 1.6 = 60% größer usw. */
    }
    #viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    #shifter {
      position: absolute;
      top: calc(-1 * (var(--static-crop-top) + var(--crop-top)));
      left: 0;
      width: 100%;
    }
    .fussballde_widget {
      width: 100% !important;
      zoom: var(--zoom);
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="shifter">
      <div
      class="fussballde_widget"
      data-id="dee66d0f-2c2b-4b49-bcff-a5689520e7c6"
      data-type="table"
        style="width: 100%"
      ></div>
    </div>
  </div>
<script>
  if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
  }
  function forceTop() {
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }
  window.addEventListener("scroll", forceTop, true);
  forceTop();

  (function () {
    // ==== EINSTELLBARE WERTE FÜR DEN SCROLL-TICKER ====
    var initialDelay   = 4000;  // EINSTELLBAR: Wartezeit (ms) bis zum ERSTEN Scrollen nach dem Laden der Seite
    var scrollDuration = 15000; // EINSTELLBAR: Dauer (ms) für den kompletten Weg von oben bis unten
    var pauseAtBottom  = 2000;  // EINSTELLBAR: Wartezeit (ms) unten, bevor es zurück nach oben springt
    var pauseAtTop     = 3000;  // EINSTELLBAR: Wartezeit (ms) oben, bevor der nächste Durchlauf startet
    // ===================================================

    var generation = 0;

    function setCrop(px) {
      document.documentElement.style.setProperty("--crop-top", px + "px");
    }

    function currentMaxCrop() {
      var shifter = document.getElementById("shifter");
      var staticCropTop = parseFloat(
        getComputedStyle(document.documentElement).getPropertyValue("--static-crop-top")
      ) || 0;
      var maxCrop = shifter.scrollHeight - window.innerHeight - staticCropTop;
      return maxCrop < 0 ? 0 : maxCrop;
    }

    function animate(myGen, duration, onDone) {
      var startTime = null;
      function step(timestamp) {
        if (myGen !== generation) { return; }
        if (!startTime) startTime = timestamp;
        var elapsed = timestamp - startTime;
        var progress = Math.min(elapsed / duration, 1);
        setCrop(currentMaxCrop() * progress);
        if (progress < 1) {
          requestAnimationFrame(step);
        } else {
          onDone();
        }
      }
      requestAnimationFrame(step);
    }

    function cycle(myGen) {
      if (myGen !== generation) { return; }
      animate(myGen, scrollDuration, function () {
        if (myGen !== generation) { return; }
        setTimeout(function () {
          if (myGen !== generation) { return; }
          setCrop(0);
          setTimeout(function () { cycle(myGen); }, pauseAtTop);
        }, pauseAtBottom);
      });
    }

    function startFresh() {
      generation++;
      var myGen = generation;
      forceTop();
      setCrop(0);
      setTimeout(function () { cycle(myGen); }, initialDelay);
    }

    startFresh();

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible") {
        startFresh();
      }
    });
  })();
</script>
</body>
</html>
