<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>TSV Großenkneten - Vereinsspiele</title>
  <script type="text/javascript" src="https://www.fussball.de/widgets.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    html, body, #viewport, #shifter {
      overflow-anchor: none;
    }
    :root {
      --crop-top: 0px;
      --zoom: 1.3; /* 1.0 = normale Größe, 1.3 = 30% größer usw. */
    }
    #viewport {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }
    #shifter {
      position: absolute;
      top: calc(-1 * var(--crop-top));
      left: 0;
      width: 100%;
      transition: top 1s ease-in-out;
    }
    .fussballde_widget {
      width: 100% !important;
      zoom: var(--zoom);
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="shifter">
      <div
        class="fussballde_widget"
        data-id="dee66d0f-2c2b-4b49-bcff-a5689520e7c6"
        data-type="table"
        style="width: 100%"
      ></div>
    </div>
  </div>

<script>
  if ("scrollRestoration" in history) {
    history.scrollRestoration = "manual";
  }
  function forceTop() {
    window.scrollTo(0, 0);
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }
  window.addEventListener("scroll", forceTop, true);
  forceTop();

  (function () {
    var initialDelay = 3000; // Wartezeit bis zum ERSTEN Scrollen (ms) → 3 Sekunden
    var step = 250;          // Pixel pro Schritt
    var stepPause = 4000;    // Wartezeit zwischen den weiteren Schritten (ms)
    var topPause = 8000;     // Wartezeit oben, bevor der Zyklus neu startet (ms)
    var current = 0;

    function tick() {
      var shifter = document.getElementById("shifter");
      var maxCrop = shifter.scrollHeight - window.innerHeight;
      if (maxCrop < 0) { maxCrop = 0; }

      current += step;
      if (current >= maxCrop) {
        current = 0;
      }

      document.documentElement.style.setProperty("--crop-top", current + "px");
      setTimeout(tick, current === 0 ? topPause : stepPause);
    }

    setTimeout(tick, initialDelay);
  })();
</script>
</body>
</html>
