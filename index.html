<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>TSV Großenkneten - Vereinsspiele</title>
  <script
    type="text/javascript"
    src="https://www.fussball.de/widgets.js">
  </script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.4s ease-in;
    }

    /*
      ANPASSUNGSWERTE:
      --crop-top    = Pixel, die oben abgeschnitten werden
      --crop-height = Pixel, die danach noch sichtbar bleiben (Höhe)
      --crop-left   = Pixel, die links abgeschnitten werden
      --crop-right  = Pixel, die rechts abgeschnitten werden
    */
    :root {
      --crop-top: 0px;
      --crop-left: 0px;
      --crop-right: 0px;
      --zoom: 1.3;
    }
    #viewport {
      width: 100vw;
      height: 100vh;      /* nutzt automatisch die tatsächliche Fenstergröße im Layout */
      overflow: hidden;
      position: relative;
    }
    #shifter {
      position: absolute;
      top: calc(-1 * var(--crop-top));
      left: calc(-1 * var(--crop-left));
      width: calc(100% + var(--crop-left) + var(--crop-right));
    }

    .fussballde_widget {
      width: 100% !important;
      zoom: var(--zoom);
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="shifter">
      <div
        class="fussballde_widget"
        data-id="dee66d0f-2c2b-4b49-bcff-a5689520e7c6"
        data-type="table"
        style="width: 100%"
      ></div>
    </div>
  </div>
  <script>
    setTimeout(function () {
      document.body.style.opacity = "1";
    }, 2500);
  </script>
</body>
</html>
